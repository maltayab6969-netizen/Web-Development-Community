كيف المتصفح بقرأ الكود","تكتب أول صفحة HTML كاملة من الصفر","تشرح وظيفة كل وسم في الهيكل الأساسي","تفرّق بين وسم الفتح ووسم الإغلاق"],paragraphs:["الويب أبسط مما تتخيل: هو مجموعة صفحات مرتبطة مع بعض، والمتصفح هو البرنامج البترجم الكود وبيعرضو ليك شكل جميل. لمن تكتب عنوان موقع، المتصفح بجيب ملف HTML، وبعدين بقرأ الوسوم سطر سطر. عشان كدا أول مهارة لازم تتقنها هي كتابة هيكل نظيف ومفهوم.","الهيكل الأساسي زي هيكل البيت. عندك <!DOCTYPE html> ودا إعلان للمتصفح إنو الملف دا HTML حديث. بعدو <html> وهو الغلاف الكبير لكل الصفحة، وجواهو قسمين: <head> للمعلومات المخفية زي العنوان، و <body> لكل حاجة المستخدم بشوفها.","الوسم <title> هو الاسم البيظهر في تبويب المتصفح، ودا مهم جداً لأنه أول حاجة المستخدم ومحرك البحث بشوفوها. أما <h1> فهو العنوان الرئيسي داخل الصفحة، و <p> للفقرات. كل وسم عندو دور محدد، ولو خلطت بينهم الصفحة بتتلخبط.","السر في التعلم هو التجربة. ما تخاف تغلط، لأنو المتصفح ما بحاسبك. جرّب تغيّر النص، أضف سطر جديد، واحفظ وشوف النتيجة. كل مرة بتجرب فيها، عقلك بربط بين الكود والنتيجة، ودا هو التعلم الحقيقي.","في نهاية الدرس دا حتكون عملت أول صفحة ليك: صفحة بتقول أهلاً بالعالم. ممكن تبدو بسيطة، لكن هي نفس البداية البدا بيها كل مطور محترف في العالم."],examples:[{title:"أول صفحة كاملة",code:`<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>صفحتي الأولى</title>
</head>
<body>
  <h1>أهلاً بالعالم</h1>
  <p>أنا بدأت رحلتي في تطوير الويب.</p>
</body>
</html>`,note:"انسخ الكود، واحفظو باسم index.html ثم افتحو في المتصفح."},{title:"الهيكل سطر سطر",code:`<!DOCTYPE html> <!-- نوع المستند -->
<html> <!-- بداية الصفحة -->
  <head> <!-- معلومات غير مرئية -->
    <title>العنوان هنا</title>
  </head>
  <body> <!-- كل ما يظهر هنا -->
  </body>
</html>`,note:"التعليق لا يظهر للمستخدم، لكنه يساعدك تتذكر وظيفة كل جزء."}],challenge:"أنشئ صفحة فيها اسمك، وثلاثة أسطر عن نفسك، وعنوان رئيسي واحد. غيّر عنوان التبويب ليكون اسمك.",summary:["<!DOCTYPE html> يعرّف نوع المستند","<head> للمعلومات و <body> للمحتوى","كل وسم مفتوح لازم يتقفل","احفظ الملف بامتداد .html"]},{id:2,title:"عناصر المحتوى في HTML",tag:"HTML",minutes:40,level:"أساسي",objectives:["تستخدم العناوين من h1 إلى h6 بالترتيب الصحيح","تكتب فقرات وروابط وصور بطريقة صحيحة","تشرح وظيفة href و src و alt","تبني صفحة شخصية متكاملة"],paragraphs:["العناوين زي عناوين الكتاب. h1 هو العنوان الكبير، وكلما زاد الرقم صغر العنوان. القاعدة الذهبية: استخدم h1 مرة واحدة فقط في الصفحة، وبعدو رتّب العناوين بشكل منطقي. كدا الصفحة بتكون مفهومة للإنسان ولمحرك البحث.",'الفقرة <p> هي المكان البتكتب فيه الكلام الطويل. أما الرابط <a> فهو قلب الويب، لأنو بربط الصفحات ببعض. الخاصية href بتحدد وين الرابط حيمشي. لو كتبت href="https://google.com" المستخدم حيمشي لقوقل لمن يضغط.',"الصورة تحتاج خاصيتين مهمتين: src وهو مكان الصورة، و alt وهو نص بديل يظهر لو الصورة ما اتحملت، ويساعد المكفوفين ومحركات البحث. ما تنسى alt أبداً، لأنو جزء من الاحترافية.","الجمال الحقيقي بيظهر لمن تجمع كل العناصر مع بعض. صفحة شخصية فيها اسمك، صورتك، نبذة عنك، وروابط حساباتك، دي أول خطوة عملية في بناء حضورك على الإنترنت.","ركّز على المعنى قبل الشكل. في الدرس دا بنبني المحتوى، وفي الدروس الجاية حنخلي شكلو جميل بالـ CSS. المطور الشاطر ببني الأساس أولاً، وبعدين يزيّن."],examples:[{title:"عناوين وفقرات وروابط",code:`<h1>محمد الطيب</h1>
<h2>مطور ويب مبتدئ</h2>
<p>أحب بناء مواقع بسيطة ومفيدة.</p>
<a href="https://google.com">اذهب إلى قوقل</a>`,note:"الرابط يفتح قوقل. جرّب تغيّر الرابط لموقع آخر تحبه."},{title:"صفحة شخصية متكاملة",code:`<h1>أهلاً، أنا سارة</h1>
<img src="my-photo.jpg" alt="صورة سارة">
<p>أتعلم تطوير الويب من الصفر.</p>
<h2>مهاراتي</h2>
<p>HTML - CSS - JavaScript</p>
<a href="mailto:sara@mail.com">راسلني</a>`,note:"alt يصف الصورة. لو الصورة ما ظهرت، النص البديل حيوضح المقصود."}],challenge:"ابنِ صفحتك الشخصية: صورتك، اسمك، نبذة من 3 أسطر، ورابطين لموقعين تحبهم.",summary:["h1 مرة واحدة فقط","href يحدد وجهة الرابط","src مكان الصورة و alt وصفها","رتّب المحتوى بمعنى واضح"]},{id:3,title:"القوائم والجداول",tag:"HTML",minutes:45,level:"أساسي",objectives:["تفرّق بين القائمة المرتبة وغير المرتبة","تبني قوائم متداخلة منظمة","تصمم جدولاً بعناوين وصفوف","تستخدم colspan و rowspan للدمج"],paragraphs:["القوائم بتنظم المعلومات. القائمة غير المرتبة <ul> بتستخدم النقاط، ومناسبة للمهارات أو المكونات. أما القائمة المرتبة <ol> فبتستخدم الأرقام، ومناسبة للخطوات. داخل كل قائمة نكتب العناصر بوسم <li>.","القوائم المتداخلة بتعني قائمة جوة قائمة. مثلاً: قائمة مهارات، وجواها قائمة فرعية لأدوات كل مهارة. السر هو أنك تقفل القائمة الداخلية قبل ما تقفل العنصر الخارجي، عشان الهيكل يكون صحيح.","الجدول هو أفضل طريقة لعرض البيانات المرتبة. <table> هو الغلاف، و <tr> هو الصف، و <th> هو عنوان العمود، و <td> هي الخلية. و <thead> و <tbody> بيساعدوك تنظم الجدول وتخلي شكلو أوضح.","أحياناً تحتاج تدمج الخلايا. colspan بدمج خلايا أفقية في نفس الصف، و rowspan بدمج خلايا عمودية. مثلاً لو طالب عندو مادتين، ممكن تدمج اسمو في خليتين.","في الحياة العملية الجداول بتستخدم لعرض الدرجات، الأسعار، المواعيد، وقوائم المنتجات. كلما كان الجدول منظم، كان أسهل في القراءة والفهم."],examples:[{title:"قائمة مهام + قائمة متداخلة",code:`<h2>مهامي اليوم</h2>
<ul>
  <li>مراجعة HTML</li>
  <li>التدرب على CSS
    <ul>
      <li>الألوان</li>
      <li>الخطوط</li>
    </ul>
  </li>
  <li>بناء مشروع صغير</li>
</ul>
<ol><li>افتح المحرر</li><li>اكتب الكود</li><li>احفظ وجرّب</li></ol>`,note:"القائمة الداخلية لازم تكون داخل <li> وليس بجانبها."},{title:"جدول درجات الطلاب",code:`<table>
  <thead><tr><th>الاسم</th><th>HTML</th><th>CSS</th></tr></thead>
  <tbody>
    <tr><td>أحمد</td><td>95</td><td>90</td></tr>
    <tr><td>سارة</td><td colspan="2">ممتازة</td></tr>
  </tbody>
</table>`,note:'colspan="2" تعني الخلية تأخذ مساحة عمودين.'}],challenge:"اعمل قائمة أكلاتك المفضلة، وجدولاً لدرجات 3 طلاب مع دمج خلية واحدة.",summary:["ul للنقاط و ol للخطوات","li هو عنصر القائمة","th للعنوان و td للبيانات","colspan أفقي و rowspan عمودي"]},{id:4,title:"النماذج والمدخلات",tag:"HTML",minutes:50,level:"أساسي",objectives:["تبني نموذجاً كاملاً بوسم form","تستخدم أنواع الإدخال المختلفة","تربط label مع input بطريقة صحيحة","تضيف التحقق الأساسي required"],paragraphs:["النموذج هو طريقة تواصل المستخدم مع الموقع. كل مرة بتسجل دخول، أو بتعمل حساب، أو بترسل رسالة، أنت بتستخدم نموذج. الوسم <form> هو الغلاف البجمع كل الحقول مع بعض.","أنواع الإدخال كثيرة، وكل نوع عندو وظيفة. text للاسم، email للبريد، password لكلمة السر، number للأرقام، و date للتاريخ. لمن تختار النوع الصحيح، المتصفح بساعد المستخدم وبيتحقق من الإدخال.","الوسم <label> مهم جداً. هو الاسم البتشوفو جنب الحقل، ولمن تربطو مع الحقل بالخاصية for، المستخدم يقدر يضغط على الاسم ويتم تحديد الحقل. دي تجربة استخدام أفضل، وبتساعد الناس البتستخدم قارئ الشاشة.","الخاصية placeholder هي النص الخفيف البظهر داخل الحقل قبل الكتابة، و required بتمنع إرسال النموذج لو الحقل فاضي. أما <select> فبتعمل قائمة منسدلة، و <textarea> للرسائل الطويلة.","في نهاية الدرس حتبني نموذج تسجيل دخول حقيقي الشكل. الشكل النهائي حيكون بسيط الآن، لكن في دروس JavaScript حنخلي النموذج يتفاعل ويتحقق من البيانات."],examples:[{title:"نموذج تسجيل دخول",code:`<form>
  <label for="email">البريد الإلكتروني</label>
  <input id="email" type="email" placeholder="name@mail.com" required>
  <label for="pass">كلمة السر</label>
  <input id="pass" type="password" placeholder="********" required>
  <button type="submit">دخول</button>
</form>`,note:"id في input لازم يطابق for في label."},{title:"نموذج تواصل متكامل",code:`<form>
  <label>الاسم</label>
  <input type="text" required>
  <label>المدينة</label>
  <select><option>الخرطوم</option><option>أم درمان</option><option>بحري</option></select>
  <label>رسالتك</label>
  <textarea rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
  <button>إرسال</button>
</form>`,note:"textarea للرسائل الطويلة، و select للاختيارات المحددة."}],challenge:"ابنِ نموذج تسجيل في الدورة: الاسم، الإيميل، المدينة، ورسالة لماذا تريد تعلم الويب؟",summary:["form يجمع الحقول","label يرتبط بـ for و id","required يمنع الإرسال الفارغ","اختر نوع input المناسب"]},{id:5,title:"الوسائط والفيديو",tag:"HTML",minutes:40,level:"أساسي",objectives:["تضيف صوتاً وفيديو بوسم audio و video","تستخدم source و controls","تضمّن فيديو يوتيوب بـ iframe","تنظم الوسائط بـ figure و figcaption"],paragraphs:["المواقع الحديثة ما بقت نص فقط. الصور والصوت والفيديو جزء أساسي من التجربة. الوسم <video> بيعرض الفيديو، و <audio> بيعرض الصوت، والخاصية controls بتضيف أزرار التشغيل والإيقاف والصوت.","داخل الفيديو بنستخدم <source> لتحديد ملف الفيديو ونوعه. ممكن تضيف أكثر من مصدر، والمتصفح بيختار أول واحد يشتغل. ولو المتصفح ما دعم الفيديو، ممكن تكتب رسالة بديلة تظهر للمستخدم.","الـ iframe هو نافذة داخل صفحتك بتعرض صفحة تانية، زي فيديو يوتيوب. لمن تنسخ كود التضمين من يوتيوب، بتكون أخدت iframe جاهز. لازم تنتبه لحجم الـ iframe عشان ما يخرب تصميم الصفحة في الجوال.","الوسم <figure> بيجمع الصورة أو الفيديو مع وصفها في <figcaption>. دا بخلي المحتوى منظم، ويساعد محركات البحث تفهم إنو الوصف تابع للوسائط.","القاعدة المهمة هي الوسائط المتجاوبة. يعني الصورة والفيديو لازم يتقلصوا مع شاشة الجوال، وما يطلعوا برا الصفحة. حنتعلم دا بالتفصيل في درس التصميم المتجاوب."],examples:[{title:"فيديو وصوت",code:`<video controls width="100%">
  <source src="lesson.mp4" type="video/mp4">
  متصفحك لا يدعم تشغيل الفيديو
</video>
<audio controls>
  <source src="song.mp3" type="audio/mpeg">
</audio>`,note:"controls مهمة جداً، بدونها المستخدم ما حيقدر يشغّل الوسائط."},{title:"فيديو يوتيوب + وصف",code:`<figure>
  <iframe width="100%" height="280"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"
    title="فيديو تعليمي" allowfullscreen>
  </iframe>
  <figcaption>شرح مبسط لبداية تطوير الويب</figcaption>
</figure>`,note:"استبدل رابط الفيديو برابط أي فيديو تعليمي تحبه."}],challenge:"اعمل صفحة فيها فيديو تعليمي، وصورة مع وصفها، وملف صوتي بأزرار تحكم.",summary:["controls تظهر أزرار التشغيل","source يحدد ملف الوسائط","iframe يضمّن صفحة أخرى","figure + figcaption للتنظيم"]},{id:6,title:"مقدمة CSS والتنسيق",tag:"CSS",minutes:45,level:"متوسط",objectives:["تشرح ما هو CSS ودوره في الموقع","تفرّق بين inline و internal و external","تستخدم المحددات الأساسية","تلوّن وتغيّر خلفية صفحة"],paragraphs:["لو HTML هو هيكل البيت، فـ CSS هو الدهان والديكور والأثاث. CSS هو اللغة البتتحكم في الألوان والخطوط والمسافات والشكل العام. بدون CSS كل المواقع حتكون بيضاء ومملة ومتشابهة.","عندك ثلاث طرق لكتابة CSS. الطريقة الأولى inline: تكتب التنسيق داخل الوسم نفسه. الثانية internal: تكتب التنسيق داخل <style> في رأس الصفحة. الثالثة external: تكتب التنسيق في ملف منفصل style.css وتربطو بالصفحة.","الطريقة الأفضل للمشاريع الكبيرة هي الملف الخارجي، لأنو بخليك تغيّر شكل الموقع كله من مكان واحد. تخيل عندك 100 صفحة، وعايز تغيّر اللون، هل حتعدّل صفحة صفحة؟ لا، حتعدّل ملف CSS واحد فقط.","المحدد selector هو الطريقة البتختار بيها العنصر العايز تنسّقو. ممكن تختار كل العناوين h1، أو تختار عنصر معين بـ class، أو عنصر واحد بـ id. فهم المحددات هو أساس كل CSS.","في الدرس دا حنبدأ نلوّن صفحتك الشخصية. حتشوف كيف سطرين CSS ممكن يحولوا صفحة عادية لصفحة جميلة ومريحة للعين."],examples:[{title:"ثلاث طرق لكتابة CSS",code:`<!-- داخل الوسم -->
<h1 style="color: blue;">أهلاً</h1>
<!-- داخل الصفحة -->
<style> h1 { color: blue; } </style>
<!-- ملف خارجي -->
<link rel="stylesheet" href="style.css">`,note:"الملف الخارجي هو الأنظف والأفضل للمشاريع الحقيقية."},{title:"أول تنسيق لصفحتك",code:`body {
  background: #f0f7ff;
  color: #111827;
  font-family: Arial;
}
h1 { color: #3b82f6; text-align: center; }
p { font-size: 18px; line-height: 1.8; }`,note:"كل قاعدة تبدأ بالمحدد، ثم القوس، ثم الخاصية والقيمة."}],challenge:"نسّق صفحتك الشخصية: غيّر لون الخلفية، ولون العنوان، وحجم الخط، ومركز العنوان.",summary:["CSS للشكل و HTML للمحتوى","الملف الخارجي أنظف وأفضل","المحدد يختار العنصر","الخاصية + القيمة = التنسيق"]},{id:7,title:"الألوان والخطوط",tag:"CSS",minutes:45,level:"متوسط",objectives:["تستخدم أنظمة الألوان HEX و RGB","تختار خطاً مناسباً وتربط خط قوقل","تتحكم في حجم ووزن الخط","تضبط تباعد الأسطر ومحاذاة النص"],paragraphs:["الألوان في الويب ليها أنظمة. النظام الأشهر هو HEX، زي #3b82f6، وهو ستة أرقام وحروف بتمثل الأحمر والأخضر والأزرق. والنظام الثاني RGB، زي rgb(59,130,246)، وهو نفس الفكرة لكن بأرقام من 0 إلى 255.","اختيار الألوان فن. ما تختار ألوان عشوائية، اختار لون رئيسي ولون ثانوي ولون محايد. الألوان الفاتحة مريحة للقراءة، والألوان القوية استخدمها للأزرار والعناوين المهمة فقط.","الخطوط بتأثر على شعور المستخدم. خط Cairo ممتاز للعربية، وهو الخط المستخدم في دورتنا. تقدر تربط أي خط من Google Fonts بسطر واحد، وبعدين تستخدمو في كل الموقع.","حجم الخط font-size ووزنه font-weight وتباعد الأسطر line-height، التلاتة ديل بيحددوا هل النص مريح ولا متعب. للنصوص العادية استخدم حجم 16 إلى 18، وتباعد 1.7 أو 1.8، وستحصل على قراءة مريحة جداً.","الاحترافية في التفاصيل الصغيرة. لمن تظبط الألوان والخطوط، موقعك حيبان أغلى وأجمل، حتى لو كان محتواه بسيط."],examples:[{title:"ألوان وخطوط احترافية",code:`@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
body { font-family: 'Cairo', sans-serif; color: #1f2937; }
h1 { color: #3b82f6; font-size: 42px; font-weight: 800; }
p { color: rgb(75, 85, 99); line-height: 1.8; text-align: justify; }`,note:"Cairo خط عربي جميل وواضح، ويدعم كل الأوزان."},{title:"بطاقة بألوان متناسقة",code:`.card {
  background: #ffffff;
  color: #111827;
  border: 2px solid #e5e7eb;
  border-radius: 16px;
  padding: 20px;
}
.card h2 { color: #8b5cf6; }
.card a { color: #3b82f6; font-weight: 700; }`,note:"لاحظ كيف الألوان القوية محصورة في العناوين والروابط."}],challenge:"اختر لونين يعجبوك، وطبّقهما على عنوانك وروابطك، وجرّب خطاً جديداً من Google Fonts.",summary:["HEX و RGB نظامان لنفس الألوان","اختر لوناً رئيسياً وثانوياً","Cairo خط عربي ممتاز","line-height يجعل القراءة مريحة"]},{id:8,title:"الصناديق والهوامش",tag:"CSS",minutes:50,level:"متوسط",objectives:["تشرح نموذج الصندوق Box Model","تفرّق بين padding و margin و border","تستخدم width و height بشكل صحيح","تستخدم box-sizing: border-box"],paragraphs:["كل عنصر في الصفحة هو صندوق. تخيل كل عنوان وفقرة وزر كأنو علبة. العلبة فيها المحتوى في النص، وبعدو حشوة داخلية اسمها padding، وبعدو إطار اسمو border، وبعدو مسافة خارجية اسمها margin.","الـ padding هو المسافة بين المحتوى والإطار. لو زودت الـ padding، العنصر حيكبر من جوه ويبان مريح. أما الـ margin فهو المسافة بين العنصر والعناصر الحولو. لو زودت الـ margin، العناصر حتبعد عن بعض.","الـ border هو الإطار. تقدر تتحكم في سماكته ولونو وشكلو. والخاصية border-radius بتخلي الزوايا مدورة، ودي من أكثر الحاجات البتخلي التصميم يبان حديث وجميل.","المشكلة الشهيرة: لمن تقول لعنصر width: 300px وتضيف padding، العرض الحقيقي بيزيد عن 300. الحل هو box-sizing: border-box، ودا بيخلي الـ padding والـ border داخل العرض، ودا هو السلوك البتوقعو أغلب المطورين.","في هذا الدرس حتتعلم تقيس المسافات بعينك. لمن تشوف موقع جميل، اسأل نفسك: كم padding هنا؟ وكم margin هناك؟ مع الوقت حتبقى تشوف التصميم كصناديق مرتبة."],examples:[{title:"صندوق مثالي",code:`* { box-sizing: border-box; }
.box {
  width: 300px;
  padding: 24px;
  border: 2px solid #3b82f6;
  border-radius: 16px;
  margin: 20px auto;
  background: #eef4ff;
}`,note:"margin: auto في اليمين واليسار يوسّط الصندوق أفقياً."},{title:"بطاقة بمسافات مريحة",code:`.profile {
  width: 320px;
  padding: 24px;
  margin: 30px auto;
  border: 1px solid #ddd;
  border-radius: 20px;
  text-align: center;
}
.profile img { border-radius: 50%; }`,note:"الفرق بين padding و margin هو: داخلي ام خارجي؟"}],challenge:"اعمل بطاقة شخصية بعرض 320px، و padding 24px، وحدود مدورة، ووسطها في الصفحة.",summary:["المحتوى ثم padding ثم border ثم margin","padding داخلي و margin خارجي","border-radius يدير الزوايا","box-sizing يحل مشكلة العرض"]},{id:9,title:"Flexbox",tag:"CSS",minutes:55,level:"متوسط",objectives:["تشرح فكرة Flexbox","تستخدم justify-content و align-items","تتحكم في اتجاه العناصر","تبني شريط تنقل وبطاقات"],paragraphs:["Flexbox هو أداة ترتيب العناصر في صف أو عمود. قبل Flexbox، كان ترتيب العناصر صعب ومليان حيل. الآن بسطر واحد display: flex، العناصر بتترتب بشكل ذكي ومرن.","أهم خاصيتين: justify-content بتتحكم في التوزيع الأفقي، و align-items بتتحكم في التوزيع العمودي. مثلاً: center بيوسّط العناصر، و space-between بيوزعها على الأطراف، ودي هي الطريقة البنعمل بيها شريط التنقل.","الخاصية flex-direction بتحدد الاتجاه. row يعني العناصر جنب بعض، و column يعني العناصر فوق بعض. و gap بتضيف مسافة متساوية بين العناصر، ودي أسهل بكتير من استخدام margin لكل عنصر.","في الحياة العملية، Flexbox بيستخدم في شريط التنقل، وأزرار الموقع، وبطاقات المنتجات، وتوسيط المحتوى. لو أتقنت Flexbox، حتقدر تبني 80% من تخطيطات المواقع الشائعة.","جرّب بنفسك: غيّر القيم وشوف النتيجة فوراً. التعلم بالتجربة هو أسرع طريقة لفهم Flexbox، لأنو كل قيمة ليها شكل واضح."],examples:[{title:"شريط تنقل بـ Flexbox",code:`nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  background: #111827;
  color: white;
}
.links { display: flex; gap: 20px; }`,note:"space-between يدفع الشعار لجهة والروابط للجهة الأخرى."},{title:"ثلاث بطاقات في صف",code:`.cards { display: flex; gap: 16px; flex-wrap: wrap; }
.card {
  flex: 1;
  min-width: 220px;
  padding: 20px;
  background: white;
  border-radius: 16px;
}`,note:"flex-wrap: wrap يجعل البطاقات تنزل لسطر جديد في الجوال."}],challenge:"ابنِ شريط تنقل فيه شعار و3 روابط، وتحته 3 بطاقات مهارات جنب بعض.",summary:["display:flex يفعّل Flexbox","justify أفقي و align عمودي","flex-direction يحدد الاتجاه","gap مسافة متساوية"]},{id:10,title:"Grid",tag:"CSS",minutes:55,level:"متقدم",objectives:["تشرح فكرة Grid","تستخدم grid-template-columns","تستخدم gap و grid-template-areas","تبني تخطيط صفحة كاملة"],paragraphs:["لو Flexbox هو ترتيب في اتجاه واحد، فـ Grid هو ترتيب في اتجاهين: صفوف وأعمدة مع بعض. Grid هو الأفضل لتخطيط الصفحة الكاملة، زي توزيع الهيدر والسايدبار والمحتوى والفوتر.","الخاصية grid-template-columns بتحدد عدد الأعمدة وعرضها. مثلاً: 1fr 2fr 1fr يعني ثلاثة أعمدة، والعمود الأوسط ضعف الباقي. و fr هي وحدة مرنة بتقسم المساحة المتبقية بشكل عادل.",'الـ gap في Grid بيعمل مسافات بين الصفوف والأعمدة، و grid-template-areas بتخليك ترسم شكل الصفحة بالكلمات. مثلاً تكتب "header header" و "sidebar main" و "footer footer"، ودي طريقة بصرية وممتعة جداً.',"في المشاريع الحقيقية، بنجمع بين الاثنين: Grid لتخطيط الصفحة الكبيرة، و Flexbox لترتيب العناصر الصغيرة داخل كل قسم. المطور الشاطر يعرف متى يستخدم كل أداة.","في هذا الدرس حتبني تخطيط صفحة كاملة: هيدر في الأعلى، قائمة جانبية، محتوى رئيسي، وفوتر. دا نفس التخطيط البتشوفو في لوحات التحكم والمتاجر."],examples:[{title:"تخطيط صفحة كاملة",code:`.layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  grid-template-areas:
    "header header"
    "sidebar main"
    "footer footer";
  gap: 16px;
}
header { grid-area: header; }
aside { grid-area: sidebar; }`,note:"grid-template-areas ترسم شكل الصفحة بالكلمات."},{title:"شبكة بطاقات متجاوبة",code:`.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.gallery div { background: #fff; padding: 20px; border-radius: 14px; }`,note:"repeat(3, 1fr) تعني: كرر عموداً مرناً ثلاث مرات."}],challenge:"ابنِ صفحة فيها هيدر، سايدبار، محتوى، وفوتر باستخدام Grid Areas.",summary:["Grid لاتجاهين معاً","fr وحدة مرنة","areas ترسم التخطيط","اجمع Grid مع Flexbox"]},{id:11,title:"التصميم المتجاوب",tag:"CSS",minutes:55,level:"متقدم",objectives:["تشرح فكرة Mobile First","تستخدم Media Queries","تجعل الصور مرنة","تبني قائمة همبرغر للجوال"],paragraphs:["التصميم المتجاوب يعني موقعك يشتغل بشكل جميل على الجوال والكمبيوتر. اليوم أكثر الناس بتصفح من الجوال، عشان كدا لازم تصمم للجوال أولاً، وبعدين توسّع التصميم للشاشات الكبيرة. دا اسمو Mobile First.","الـ Media Queries هي الشرط البيقول للمتصفح: لو الشاشة أصغر من كذا، طبّق التنسيق دا. مثلاً: @media (max-width: 768px) تعني الشاشات الأصغر من 768 بكسل. ودا هو نقطة الكسر breakpoint الشهيرة للجوال.","الصور المتجاوبة قاعدتها بسيطة: max-width: 100% و height: auto. كدا الصورة ما حتطلع برا الشاشة أبداً، وحتحافظ على شكلها. بدون هذه القاعدة، الصورة الكبيرة حتخرب التصميم كله.","قائمة الهمبرغر هي زر الثلاثة خطوط البتشوفو في الجوال. لمن تضغط عليه، القائمة بتظهر أو بتختفي. في البداية ممكن تعملها بـ CSS فقط، وبعدين في دروس JavaScript حتخليها تتفاعل بشكل حقيقي.","اختبر موقعك دائماً على الجوال. غيّر حجم نافذة المتصفح، أو استخدم أدوات المطور، وشوف هل كل حاجة في مكانها ولا في حاجة طالعة برا؟"],examples:[{title:"Media Query للجوال",code:`/* للكمبيوتر */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); }
/* للجوال */
@media (max-width: 768px) {
  .cards { grid-template-columns: 1fr; }
  h1 { font-size: 28px; }
  nav { flex-direction: column; }
}`,note:"ابدأ بتصميم الجوال، ثم أضف تحسينات الشاشات الكبيرة."},{title:"صور مرنة وقائمة جوال",code:`img { max-width: 100%; height: auto; display: block; }
.menu-btn { display: none; }
@media (max-width: 768px) {
  .menu-btn { display: block; }
  .links { display: none; }
}`,note:"في الجوال نخفي الروابط ونظهر زر القائمة."}],challenge:"حوّل موقعك ليكون متجاوباً: البطاقات عمود واحد في الجوال، و3 أعمدة في الكمبيوتر.",summary:["صمّم للجوال أولاً","768px و 1024px نقاط كسر شهيرة","max-width:100% للصور","اختبر على كل الشاشات"]},{id:12,title:"مقدمة JavaScript",tag:"JS",minutes:50,level:"متقدم",objectives:["تشرح ما هي JavaScript","تستخدم وسم script","تستخدم console.log","تفرّق بين let و const"],paragraphs:["لو HTML هو الهيكل و CSS هو الشكل، فـ JavaScript هي الروح والحركة. هي البتخلي الزر يشتغل، والقائمة تنفتح، والنموذج يتحقق من البيانات، والموقع يتفاعل مع المستخدم.","تكتب JavaScript داخل وسم <script> في نهاية <body>، أو في ملف منفصل script.js. والسبب إننا نكتبها في النهاية هو إننا نريد HTML يتحمل أولاً، وبعدين يجي التفاعل.",'الـ console هو مكان المطورين. لمن تكتب console.log("أهلاً")، الرسالة بتظهر في وحدة تحكم المتصفح. دا أداة مهمة للتجربة واكتشاف الأخطاء. اضغط F12 في المتصفح وجرّب.','المتغير هو صندوق بتخزن فيه قيمة. let للمتغيرات البتتغير، و const للمتغيرات الثابتة. مثلاً: let age = 20 يعني العمر ممكن يتغير، و const name = "أحمد" يعني الاسم ثابت.',"أنواع البيانات الأساسية: نص string، رقم number، صحيح أو خطأ boolean، وقائمة array، وكائن object. فهم الأنواع دي هو أساس كل برمجة."],examples:[{title:"أول كود JavaScript",code:`<script>
  console.log("أهلاً بالعالم");
  alert("مرحباً بك في موقعي!");
  let name = "محمد";
  const age = 22;
  console.log("اسمي " + name);
<\/script>`,note:"alert تظهر نافذة منبثقة. استخدمها بحذر في المواقع الحقيقية."},{title:"متغيرات وأنواع بيانات",code:`let userName = "سارة";
let score = 95;
let isStudent = true;
let skills = ["HTML", "CSS", "JS"];
const siteName = "موقعي الأول";
console.log(userName, score, isStudent);`,note:"الاسم يبدأ بحرف، ولا يحتوي على مسافات."}],challenge:"اكتب كود يعرّف اسمك وعمرك ومدينتك، ويطبعها في console، ويظهر رسالة ترحيب.",summary:["JS للتفاعل والحركة","script في نهاية body","console.log للتجربة","let متغير و const ثابت"]},{id:13,title:"المتغيرات والدوال",tag:"JS",minutes:60,level:"متقدم",objectives:["تستخدم المتغيرات بثقة","تكتب دالة بـ parameters و return","تستخدم if else لاتخاذ القرار","تستخدم الحلقات for و while"],paragraphs:["الدالة هي وصفة جاهزة. بدل ما تكرر نفس الكود كل مرة، تكتب الدالة مرة واحدة، وبعدين تناديها وقت ما تحتاجها. مثلاً: دالة لحساب مجموع عددين، ودالة للترحيب بالمستخدم.","الـ parameters هي المدخلات البتدخلها للدالة، و return هو الناتج البترجعو ليك. مثلاً: دالة add(5,3) حترجع 8. فهم الدوال هو أهم مهارة في البرمجة.","الشرط if else هو اتخاذ القرار. لو المستخدم مسجل دخول، أظهر له لوحة التحكم، وإلا أظهر له زر تسجيل الدخول. البرمجة كلها مبنية على قرارات من هذا النوع.","الحلقات بتكرر الكود. for بتكرر عدد مرات محدد، و while بتكرر طالما الشرط صحيح. مثلاً: اطبع الأرقام من 1 إلى 10، أو اعرض كل عناصر قائمة.","في هذا الدرس حتبني آلة حاسبة صغيرة. دي أول أداة حقيقية تعملها بالكود، وحتحس فيها بمتعة البرمجة الحقيقية."],examples:[{title:"دوال وشروط",code:`function welcome(name) {
  return "أهلاً " + name;
}
function checkAge(age) {
  if (age >= 18) return "بالغ";
  else return "قاصر";
}
console.log(welcome("سارة"));
console.log(checkAge(20));`,note:"الدالة لا تعمل إلا عندما تناديها باسمها."},{title:"حلقة وآلة حاسبة",code:`for (let i = 1; i <= 5; i++) {
